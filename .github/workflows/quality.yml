name: quality
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '35 6 * * *'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-locked tools
        run: make tools
      - name: Validate workflow definitions and trust boundaries
        run: |
          .tools/bin/actionlint
          python3 scripts/check-workflows.py
      - name: Unit, policy, chart, reproducibility, runtime, SBOM and vulnerability gates
        run: make check
      - name: Local signature and tamper rejection
        run: ./scripts/sign-local.sh
      - name: Disposable cluster and network-policy integration
        run: make cluster
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/*.json
            artifacts/*.txt
            artifacts/*.cdx.json
            artifacts/*.yaml
            artifacts/cluster/*.txt
            artifacts/cluster/*.json
          retention-days: 14
          if-no-files-found: error
